<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- calorAI app icon — master vector. Coral tile, bold white C, droplet in the counter. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5F"/>
      <stop offset="1" stop-color="#F04E23"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- The C: mid-radius 118 ring, 58 wide, opening ±39° at 3 o'clock -->
  <path d="M347.7 181.74 A118 118 0 1 0 347.7 330.26" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="butt"/>
  <!-- The droplet: tip up, round base, floating centered in the C's counter -->
  <path d="M256 192 C245 213 218 247 218 280 A38 38 0 0 0 294 280 C294 247 267 213 256 192 Z" fill="#FFFFFF"/>
</svg>
